acceptance_criteria_verification:
  - criterion: "User can toggle between 'Screen+OCR' and 'Audio-only' modes before starting"
    result: "PASS"
    evidence: "Header.tsx renders mode toggle with two buttons; disabled={isActive} prevents switching during session"

  - criterion: "In Audio-only mode, clicking Start captures mic audio without triggering screen share prompt"
    result: "PASS"
    evidence: "App.tsx handleStart dispatches handleStartAudioOnly (calls startAudio only, no startCapture)"

  - criterion: "Live transcription segments appear in the transcript panel with language and confidence badges"
    result: "PASS"
    evidence: "OCRResultList (slide-grouped cards) renders audio segments with audio badge; confidence shown via AudioSegmentItem for screen-ocr interleave"

  - criterion: "Screen panel shows an audio indicator (e.g., pulsing mic icon) instead of video preview"
    result: "PASS"
    evidence: "MainLayout renders AudioOnlyPanel with pulsing SVG mic icon when mode is audio-only"

  - criterion: "Stop recording produces a session summary from the audio transcript"
    result: "PASS"
    evidence: "handleStopAudioOnly calls generateSummary([], audioOnlyStartRef.current, audioSegments); useSummary handles results=[] with audio correctly"

  - criterion: "Switching modes is disabled while a session is active"
    result: "PASS"
    evidence: "Header passes disabled={isActive} to toggle buttons; CSS adds mode-toggle-disabled class"

  - criterion: "Existing Screen+OCR mode behavior is unchanged"
    result: "PASS"
    evidence: "Screen-ocr code paths identical; audio useEffect gated on mode === 'screen-ocr'; handleStop unchanged"

edge_cases:
  - case: "Audio-only mode: zero audio segments (user doesn't speak)"
    handled: true
    how: "generateSummary([], null, []) hits early return — summary shows 'No text was captured'"

  - case: "Audio-only mode: mic permission denied"
    handled: true
    how: "useAudioCapture sets audioError; header shows 'No audio' indicator; isListening stays false"

  - case: "Audio-only mode: Web Speech API unavailable"
    handled: true
    how: "getSpeechRecognition() returns null → audioError set; no crash"

  - case: "Mode switch attempted during active session"
    handled: true
    how: "Toggle buttons are disabled={isActive} + CSS pointer-events: none"

  - case: "Audio-only mode: session duration calculation"
    handled: true
    how: "audioOnlyStartRef.current = Date.now() on start; passed to generateSummary as sessionStart"

  - case: "Screen-ocr mode: audio does NOT start in audio-only mode"
    handled: true
    how: "useEffect guard: if (isSharing && mode === 'screen-ocr') — audio-only mode doesn't trigger"

  - case: "Dismiss summary in audio-only mode resets state"
    handled: true
    how: "handleDismissSummary clears summary, results, and audioSegments"

  - case: "Audio-only summary with fullText generation"
    handled: true
    how: "When results=[], ocrText='', fullText = '--- Audio Transcript ---\\n' + audioTranscript"

  - case: "Rapid mode switch before starting"
    handled: true
    how: "Mode is just state; no side effects until Start is clicked"

  - case: "isRecordingAudio not reset on error"
    handled: false
    severity: "low"
    how: >
      If startAudio fails silently (e.g., no SpeechRecognition), isRecordingAudio
      stays true but isListening stays false. User can still click Stop to reset.
      Not a blocking issue — user flow still works.

regression_check:
  ocr_pipeline_affected: false
  screen_capture_affected: false
  existing_components_broken: false
  notes: >
    All changes are additive. Existing Screen+OCR code paths are unchanged.
    The screen capture (useScreenCapture), frame extraction (useFrameExtractor),
    OCR (useOCR), and all OCR services are completely untouched. Component
    interfaces received new props (mode, isActive) but existing behavior is
    preserved when mode is 'screen-ocr'. The audio useEffect is now
    additionally gated on mode, but the isSharing condition was already
    present — so screen-ocr behavior is identical.

