epic:
  project_key: ""  # FILL IN
  issue_type: "Epic"
  summary: "Audio-only transcription mode"
  description: >
    Add a standalone "Audio-only" mode alongside the existing Screen+OCR mode.
    When selected, the app captures microphone audio via the browser Web Speech
    API without triggering a screen share prompt. Live transcription segments
    are displayed in the transcript panel. The screen panel is replaced with a
    pulsing mic indicator. Session summary is generated from audio data alone.
    Modes are mutually exclusive; the toggle is disabled during active sessions.
  labels:
    - "audio-only"
    - "feature"
    - "v3"
  components: []
  priority: "Medium"

stories:
  - key_suffix: "T1"
    issue_type: "Task"
    summary: "Add AppMode type to shared types"
    description: >
      Add AppMode = 'screen-ocr' | 'audio-only' type to the shared types
      module. No other type changes needed — existing AudioSegment,
      SessionSummary, etc. already support audio-only data.
    acceptance_criteria:
      - "AppMode type exists in src/types/index.ts and is exported"
      - "Type includes exactly 'screen-ocr' and 'audio-only' as values"
      - "No breaking changes to existing type exports"
    estimate: "XS"
    labels: ["audio-only"]

  - key_suffix: "T2"
    issue_type: "Story"
    summary: "Add mode state and conditional start/stop logic to App.tsx"
    description: >
      Add mode state (default: 'screen-ocr') to App.tsx. In audio-only mode,
      Start button begins audio capture without triggering screen share. Stop
      button ends audio and generates summary from audio data alone. Session
      start timestamp tracked independently for duration calculation. Mode
      toggle disabled while a session is active.
    acceptance_criteria:
      - "App has a mode state variable defaulting to 'screen-ocr'"
      - "In audio-only mode, Start captures mic without screen share prompt"
      - "In audio-only mode, Stop generates summary from audio segments"
      - "Session duration is calculated correctly for audio-only sessions"
      - "Mode cannot be changed while a session is active"
      - "Screen+OCR mode behavior is completely unchanged"
    estimate: "S"
    labels: ["audio-only"]

  - key_suffix: "T3"
    issue_type: "Story"
    summary: "Add mode toggle and adaptive controls to Header"
    description: >
      Add a segmented toggle in the header to switch between 'Screen+OCR'
      and 'Audio-only' modes. Toggle is disabled during active sessions.
      Start/Stop button labels adapt: "Start Sharing" / "Start Recording".
      Slide count shown only in screen-ocr mode. Mic indicator shown in
      audio-only mode when recording.
    acceptance_criteria:
      - "Mode toggle visible in header with two options"
      - "Toggle is disabled (greyed out) when a session is active"
      - "Button reads 'Start Sharing' in screen-ocr mode, 'Start Recording' in audio-only"
      - "Slide count badge hidden in audio-only mode"
      - "Mic listening indicator shown in audio-only mode during recording"
    estimate: "S"
    labels: ["audio-only"]

  - key_suffix: "T4"
    issue_type: "Task"
    summary: "Create AudioOnlyPanel component"
    description: >
      New visual component that replaces ScreenPanel when in audio-only mode.
      Shows a centered pulsing microphone icon and status label:
      "Listening..." when recording, "Ready to record" when idle.
    acceptance_criteria:
      - "AudioOnlyPanel renders a mic icon with pulsing animation when active"
      - "Shows 'Listening...' label when recording is active"
      - "Shows 'Ready to record' label when idle"
      - "Fills the same layout space as ScreenPanel"
    estimate: "XS"
    labels: ["audio-only"]

  - key_suffix: "T5"
    issue_type: "Task"
    summary: "Update MainLayout for mode-conditional panel rendering"
    description: >
      MainLayout accepts mode prop. When mode is 'audio-only', renders
      AudioOnlyPanel instead of ScreenPanel in the left column. The
      transcript panel (right column) is always rendered.
    acceptance_criteria:
      - "AudioOnlyPanel shown in left column when mode is 'audio-only'"
      - "ScreenPanel shown in left column when mode is 'screen-ocr'"
      - "Transcript panel always visible in both modes"
      - "No visual regression in screen-ocr mode"
    estimate: "XS"
    labels: ["audio-only"]

  - key_suffix: "T6"
    issue_type: "Task"
    summary: "Add CSS for mode toggle and audio-only panel"
    description: >
      Add styles for mode toggle segmented control, audio-only panel with
      pulsing mic animation, and responsive adjustments.
    acceptance_criteria:
      - "Mode toggle styled as a segmented control with active state"
      - "Disabled state visually distinct (greyed out)"
      - "Audio-only panel has centered mic icon with pulse animation"
      - "Responsive layout works on mobile viewports"
    estimate: "XS"
    labels: ["audio-only"]

  - key_suffix: "T7"
    issue_type: "Task"
    summary: "Handle audio-only session summary edge cases"
    description: >
      Verify and fix useSummary.generateSummary for the case where OCR
      results are empty but audio segments exist. Ensure summary narrative
      and stats make sense for audio-only sessions.
    acceptance_criteria:
      - "Summary generated correctly with zero OCR results and non-zero audio segments"
      - "Duration calculated from audio-only session start time"
      - "Narrative text makes sense without OCR context"
      - "No error or 'no text captured' message when audio data exists"
    estimate: "XS"
    labels: ["audio-only"]
