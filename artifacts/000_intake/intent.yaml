meta:
  created_at: "2026-02-16T00:00:00-08:00"
  source:
    type: "text"
    ref: "chat"
  requester: "eng"

feature:
  title: "Audio-only transcription mode"
  problem: >
    Currently the app requires screen sharing to function. Users who only want
    speech-to-text transcription (e.g., meetings, lectures, dictation) must
    still initiate a screen capture, which is unnecessary overhead and a
    confusing UX.
  scope:
    in:
      - "New 'Audio-only' mode selectable alongside existing 'Screen+OCR' mode"
      - "Microphone capture without screen sharing"
      - "Live speech-to-text transcription displayed in transcript panel"
      - "Per-segment language detection and confidence display"
      - "Screen panel hidden or replaced with audio waveform/indicator"
      - "Independent start/stop recording controls for audio-only mode"
      - "Session summary generated from audio transcript when stopped"
    out:
      - "Backend / cloud STT service (browser Web Speech API only for MVP)"
      - "Simultaneous screen+audio-only (modes are mutually exclusive)"
      - "Audio file upload / import"
      - "Speaker diarization"
      - "Rewrite of existing Screen+OCR mode"
  constraints:
    - "Browser-based only — no server-side components"
    - "Existing React + Vite + TypeScript stack"
    - "No backend services required for MVP (Web Speech API)"
    - "Must coexist cleanly with existing Screen+OCR mode"
    - "UI must clearly indicate which mode is active"
    - "v3 feature enhancement, not a rewrite"
  acceptance_criteria:
    - "User can toggle between 'Screen+OCR' and 'Audio-only' modes before starting"
    - "In Audio-only mode, clicking Start captures mic audio without triggering screen share prompt"
    - "Live transcription segments appear in the transcript panel with language and confidence badges"
    - "Screen panel shows an audio indicator (e.g., pulsing mic icon) instead of video preview"
    - "Stop recording produces a session summary from the audio transcript"
    - "Switching modes is disabled while a session is active"
    - "Existing Screen+OCR mode behavior is unchanged"
  nonfunctional:
    performance:
      - "Transcription latency should match existing audio pipeline (<500ms for interim results)"
    reliability:
      - "Graceful handling if browser does not support Web Speech API"
      - "Clear error state if microphone permission is denied"
    security:
      - "No audio data leaves the browser in MVP (Web Speech API runs locally where supported)"
